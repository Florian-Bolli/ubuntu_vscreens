name: Pack extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install gnome-extensions CLI
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gnome-shell

      - name: Pack zip
        run: ./pack.sh

      - name: Check zip layout
        run: unzip -l vscreens@florianbolli.ch.shell-extension.zip

      - uses: actions/upload-artifact@v4
        with:
          name: vscreens@florianbolli.ch.shell-extension.zip
          path: vscreens@florianbolli.ch.shell-extension.zip
          if-no-files-found: error

      # Pull requests only pack the zip. A push to main also submits it for
      # review. Secrets: EGO_USERNAME and EGO_PASSWORD for extensions.gnome.org.
      - name: Upload to extensions.gnome.org
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          EGO_USERNAME: ${{ secrets.EGO_USERNAME }}
          EGO_PASSWORD: ${{ secrets.EGO_PASSWORD }}
        run: |
          sudo apt-get install --yes --no-install-recommends python3-requests python3-bs4
          python3 .github/upload-ego.py vscreens@florianbolli.ch.shell-extension.zip
